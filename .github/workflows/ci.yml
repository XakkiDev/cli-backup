name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Lint and compile
        run: |
          ruff check --select E9,F63,F7,F82 src tests
          python -m compileall -q src tests
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Check installed CLI
        run: |
          python -m venv /tmp/cli-backup-wheel-test
          /tmp/cli-backup-wheel-test/bin/pip install dist/*.whl
          /tmp/cli-backup-wheel-test/bin/cli-backup --help
          /tmp/cli-backup-wheel-test/bin/cli-backup scheduled --help
