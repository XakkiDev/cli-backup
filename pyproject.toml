[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-backup"
version = "0.1.0"
description = "Host backup CLI for database snapshots and directory archives"
requires-python = ">=3.11"
dependencies = ["boto3==1.43.127"]
license = "MIT"

[project.optional-dependencies]
dev = ["ruff==0.6.9"]

[project.scripts]
cli-backup = "cli_backup.cli:main"
