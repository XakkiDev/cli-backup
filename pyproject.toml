[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-backup"
version = "0.2.1"
description = "Host backup CLI for database snapshots and directory archives"
requires-python = ">=3.11"
dependencies = ["boto3==1.43.127"]
license = "MIT"
readme = "README.md"
keywords = ["backup", "mysql", "mariadb", "postgresql", "sqlite", "s3"]

[project.urls]
Homepage = "https://github.com/XakkiDev/cli-backup"
Issues = "https://github.com/XakkiDev/cli-backup/issues"

[project.optional-dependencies]
dev = ["ruff==0.6.9"]

[project.scripts]
cli-backup = "cli_backup.cli:main"
